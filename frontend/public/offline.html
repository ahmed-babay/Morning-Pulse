<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18201c" />
    <title>Morning Pulse · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        background: #f5f5ef;
        color: #18201c;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      img {
        width: 5rem;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
      }
      p {
        color: #657069;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>
        Your saved Morning Pulse data remains available in the app. Reconnect
        and refresh for the latest briefing.
      </p>
    </main>
  </body>
</html>
